# S -> S + S | T | x ;  T -> S * S | y
# T sits one level below S and nests S again, so HighToLow(G, O_bp) is non-empty and
# GenTA emits a cycle transition.  See docs/divergences.md.
nonterms S T
terms PLUS STAR X Y
starts S
prod S N:S T:PLUS N:S
prod S N:T
prod S T:X
prod T N:S T:STAR N:S
prod T T:Y
