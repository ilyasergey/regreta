# Four binary operators at one base order, plus a base case.
#
# With two rejected precedence examples that relate the first and last operator and the
# two middle ones, a comparison sort of the conflict group never compares the first with
# the last, and silently drops that constraint.  `Greta/Learn.lean` therefore linearises
# each group with `topoSort` (Kahn's algorithm) rather than `List.mergeSort`; see
# `docs/divergences.md`.
nonterms S
terms PLUS STAR MINUS SLASH X
starts S
prod S N:S T:PLUS N:S
prod S N:S T:STAR N:S
prod S N:S T:MINUS N:S
prod S N:S T:SLASH N:S
prod S T:X
