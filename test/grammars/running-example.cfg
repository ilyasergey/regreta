# The ambiguous grammar G of Figure 1 of the paper.
nonterms stmt decl expr ident
terms SEMI IF THEN ELSE PLUS STAR INT LPAREN RPAREN TINT EQ IDENT
starts stmt
prod stmt N:decl T:SEMI
prod stmt T:IF N:expr T:THEN N:stmt
prod stmt T:IF N:expr T:THEN N:stmt T:ELSE N:stmt
prod decl T:TINT N:ident T:EQ N:expr
prod ident T:IDENT
prod expr N:expr T:PLUS N:expr
prod expr N:expr T:STAR N:expr
prod expr T:INT
prod expr T:LPAREN N:expr T:RPAREN
prod expr N:ident
